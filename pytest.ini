[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-markers
    --strict-config

markers =
    unit: Fast isolated unit tests
    integration: Tests involving multiple StructuralBot modules
    billing: Billing and commercial infrastructure tests
    bot: Telegram bot and handler tests
    ai: AI layer tests
    engineering: Engineering calculation and code tests
    architecture: Project architecture and import tests
    slow: Tests that may take longer than normal

filterwarnings =
    error
    ignore::DeprecationWarning
