services:
  structuralbot-test:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: structuralbot-test

    environment:
      BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk"

      DATABASE_PATH: "/tmp/structuralbot_test.db"

      STRUCTURALBOT_TESTING: "true"

      AI_ENABLED: "false"
      AI_PROVIDER: "placeholder"

      PAYMENT_PROVIDER: "placeholder"
      PAYMENT_GATEWAY_ENABLED: "false"

    volumes:
      - .:/app

    working_dir: /app

    command:
      [
        "pytest",
        "-ra"
      ]

    restart: "no"
