name: StructuralBot Routing Smoke

on:
  push:
    branches:
      - audit-all-buttons-20260930
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - name: Import and build
        run: |
          BOT_TOKEN=123456789:TEST_TOKEN_123456789 python -c "import bot; app=bot.create_application(); print('APP_OK', len(app.handlers))"
