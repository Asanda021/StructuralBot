name: debug-smoke
on:
  push:
    branches: ["main"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run smoke and capture traceback
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python tests/smoke_test.py > smoke_output.txt 2>&1
          rc=$?
          echo "RETURN_CODE=$rc" >> smoke_output.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-debug
          path: smoke_output.txt
