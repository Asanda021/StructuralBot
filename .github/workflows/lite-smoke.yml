name: smoke
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "from app.engine import estimate_building; d={'floors':3,'area':120,'foundation_count':8,'footing_w':1.5,'footing_l':1.5,'footing_t':0.5,'columns_per_floor':12,'column_w':0.35,'column_d':0.35,'floor_h':3,'beam_length_per_floor':80,'beam_w':0.3,'beam_h':0.5,'slab_t':0.15,'stair_area_per_floor':10,'stair_t':0.15}; r=estimate_building(d); assert r['totals']['concrete_net']>0; assert r['totals']['formwork_net']>0; assert r['totals']['rebar_net']>0; print('ENGINE_OK', r['totals'])"
      - run: python -c "import bot; print('BOT_IMPORT_OK')"
