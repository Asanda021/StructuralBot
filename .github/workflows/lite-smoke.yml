name: lite-smoke
on:
  push:
    branches: ["lite-rebuild-20260930"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "from app.engine import foundation_calc, column_calc, beam_calc, slab_calc; print(foundation_calc(1,2,.3)); print(column_calc(.4,.4,3)); print(beam_calc(.3,.5,5)); print(slab_calc(.15,5,4))"
      - run: python -c "import bot; print('BOT_IMPORT_OK')"
