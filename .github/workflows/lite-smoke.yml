name: smoke
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python tests/smoke_test.py
      - run: python -c "import bot; from app.engine import estimate_members; from app.exporter import create_excel, create_pdf; print('BOT_EXPORT_IMPORT_OK')"
