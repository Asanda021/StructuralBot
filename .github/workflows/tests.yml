name: StructuralBot Tests

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk"
      DATABASE_PATH: "tests/.test_structuralbot.db"
      STRUCTURALBOT_TESTING: "true"

      AI_ENABLED: "false"
      AI_PROVIDER: "placeholder"
      PAYMENT_PROVIDER: "placeholder"
      PAYMENT_GATEWAY_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio

      - name: Check tracked environment files
        shell: bash
        run: |
          if git ls-files | grep -E '\.env        run: |
          python --version
          pip --version

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Run test suite
        run: |
          pytest -ra

      - name: Check Git status
        if: always()
        run: |
          git status --short
; then
            echo "A real .env file must never be tracked."
            exit 1
          fi

      - name: Verify Python version
        run: |
          python --version
          pip --version

      - name: Compile Python files
        run: |
          python -m compileall -q .

      - name: Run test suite
        run: |
          pytest -ra

      - name: Check Git status
        if: always()
        run: |
          git status --short
