name: StructuralBot Tests\n\non:\n  push:\n    branches:\n      - main\n      - master\n      - develop\n      - "release-ready-*"\n  pull_request:\n    branches:\n      - main\n      - master\n      - develop\n  workflow_dispatch:\n\njobs:\n  test:\n    name: Python Tests\n    runs-on: ubuntu-latest\n    strategy:\n      fail-fast: false\n      matrix:\n        python-version: ["3.11", "3.12", "3.13"]\n    env:\n      BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijk"\n      DATABASE_PATH: "tests/.test_structuralbot.db"\n      STRUCTURALBOT_TESTING: "true"\n      APP_ENV: "test"\n      SECRET_KEY: "test-secret"\n      AI_ENABLED: "false"\n      AI_PROVIDER: "placeholder"\n      PAYMENT_PROVIDER: "placeholder"\n      PAYMENT_GATEWAY_ENABLED: "false"\n    steps:\n      - name: Checkout repository\n        uses: actions/checkout@v4\n      - name: Set up Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n          cache: pip\n      - name: Install project dependencies\n        run: |\n          python -m pip install --upgrade pip\n          pip install -r requirements.txt\n          pip install pytest pytest-asyncio\n      - name: Check tracked environment files\n        shell: bash\n        run: |\n          if git ls-files | grep -E '^\\.env$|/\\.env$'; then\n            echo "A real .env file must never be tracked."\n            exit 1\n          fi\n      - name: Compile Python files\n        run: python -m compileall -q .\n      - name: Run test suite\n        run: pytest -ra\n      - name: Check Git status\n        if: always()\n        run: git status --short\n